<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./main-themes/blue/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./newtab.css" />
    <title>Startpage</title>
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar-container container">
        <input type="checkbox" name="" id="" />
        <div class="hamburger-lines">
          <span class="line line1"></span>
          <span class="line line2"></span>
          <span class="line line3"></span>
        </div>
        <ul class="menu-items">
          <li><a data-theme="blue">blue</a></li>
          <li><a data-theme="cherry">cherry</a></li>
          <li><a data-theme="violet">violet</a></li>
          <li><a data-theme="green">green</a></li>
          <li><a data-theme="mesh-purple">mesh-purple</a></li>
          <li><a data-theme="orange">orange</a></li>
          <li><a data-theme="purple">purple</a></li>
          <li><a data-theme="white">white</a></li>
          <li><a data-theme="retro-gradient">retro-gradient</a></li>
          <li><a data-theme="summer-wave">summer-wave</a></li>
          <li>
            <a data-theme="Animated-Gradient">animated-gradient</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="wrapper">
      <div class="bg"></div>
      <div class="maincard">
        <div class="folder_tabs" id="folder_tabs"></div>
        <div class="content" id="content">
          <div class="image">
            <img id="img" src="./main-themes/blue/images/gif.gif" alt="" />
          </div>
          <div id="links" class="links"></div>
        </div>
        <div class="search">
          <form id="search_form">
            <label for="search_box" autofocus>> find / </label>
            <input
              type="text"
              placeholder="Type Here"
              name="search_box"
              id="search_box"
              autocomplete="off"
              autofocus
            />
          </form>
        </div>
        <div class="card_tools">
          <button id="add_button" title="add a bookmark or page">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="edit_button" title="edit: click a link or the open tab to change it">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <dialog id="editor" class="editor">
      <div class="editor_modes" id="editor_modes">
        <button type="button" data-mode="link">bookmark</button>
        <button type="button" data-mode="page">page</button>
        <button type="button" data-mode="backup">backup</button>
      </div>

      <form id="link_form" class="editor_form" data-mode="link">
        <h3 id="link_form_title">new bookmark</h3>
        <label>name <input name="link_name" required autocomplete="off" /></label>
        <label>url <input name="url" required autocomplete="off" /></label>
        <label>page <select name="page"></select></label>
        <label>section <select name="section"></select></label>
        <label class="new_section" hidden>new section <input name="new_section" autocomplete="off" /></label>
        <div class="editor_buttons">
          <button type="button" class="danger" data-action="delete" hidden>delete</button>
          <button type="button" data-action="cancel">cancel</button>
          <button type="submit">save</button>
        </div>
      </form>

      <form id="page_form" class="editor_form" data-mode="page">
        <h3 id="page_form_title">new page</h3>
        <label>name <input name="page_name" required autocomplete="off" /></label>
        <label>theme <select name="theme"></select></label>
        <label>image <select name="image"></select></label>
        <div class="editor_buttons">
          <button type="button" class="danger" data-action="delete" hidden>delete page</button>
          <button type="button" data-action="cancel">cancel</button>
          <button type="submit">save</button>
        </div>
      </form>

      <div class="editor_form" data-mode="backup">
        <h3>backup</h3>
        <p>Your pages are stored in the browser. Export them to a file to keep a copy, or to move them to another browser.</p>
        <div class="editor_buttons">
          <button type="button" data-action="import">import…</button>
          <button type="button" data-action="export">export</button>
          <button type="button" data-action="cancel">close</button>
        </div>
        <input type="file" id="import_file" accept=".json,application/json" hidden />
      </div>
      <p class="editor_error" id="editor_error" hidden></p>
    </dialog>
  </body>
  <script src="store.js"></script>
  <script src="newtab.js"></script>
</html>
